<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Livro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 600px;">

<h2 class="mb-4" th:text="${livro.id == null ? 'Novo Livro' : 'Editar Livro'}"></h2>

<form th:action="@{/livros/salvar}" th:object="${livro}" method="post" class="card p-4 shadow-sm">
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">Título do Livro:</label>
        <input type="text" th:field="*{titulo}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Ano de Publicação:</label>
        <input type="number" th:field="*{ano}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Autor (Relacionamento):</label>
        <select th:field="*{autor}" class="form-select" required>
            <option value="">-- Selecione o Autor --</option>
            <option th:each="aut : ${autores}" th:value="${aut.id}" th:text="${aut.nome}"></option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoria (Relacionamento):</label>
        <select th:field="*{categoria}" class="form-select" required>
            <option value="">-- Selecione a Categoria --</option>
            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
        </select>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Salvar</button>
        <a th:href="@{/livros}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
</body>
</html>
