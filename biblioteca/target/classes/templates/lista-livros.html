<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Biblioteca - Livros</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Catálogo de Livros</h2>
  <div>
    <a th:href="@{/livros/novo}" class="btn btn-success">Cadastrar Novo Livro</a>
    <a th:href="@{/dashboard}" class="btn btn-info text-white">Ver Gráfico</a>
  </div>
</div>

<form th:action="@{/livros}" method="get" class="row g-3 mb-4 align-items-end">
  <div class="col-md-4">
    <label class="form-label fw-bold">Filtrar por Categoria para Pesquisa:</label>
    <select name="categoriaId" class="form-select">
      <option value="">-- Todas as Categorias --</option>
      <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
    </select>
  </div>
  <div class="col-md-4">
    <button type="submit" class="btn btn-primary">Pesquisar</button>
    <a th:href="@{/livros}" class="btn btn-secondary">Limpar</a>
  </div>
</form>

<table class="table table-striped table-bordered">
  <thead class="table-dark">
  <tr>
    <th>Título</th>
    <th>Ano</th>
    <th>Autor</th>
    <th>Categoria</th>
    <th>Ações</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="livro : ${livros}">
    <td th:text="${livro.titulo}"></td>
    <td th:text="${livro.ano}"></td>
    <td th:text="${livro.autor != null ? livro.autor.nome : 'Sem Autor'}"></td>
    <td th:text="${livro.categoria != null ? livro.categoria.nome : 'Sem Categoria'}"></td>
    <td>
      <a th:href="@{/livros/editar/{id}(id=${livro.id})}" class="btn btn-warning btn-sm">Editar</a>
      <a th:href="@{/livros/deletar/{id}(id=${livro.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Deseja excluir este livro?')">Excluir</a>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
